{# Modal de input de Validade #}
<div class="modal-overlay" id="modalValidadeOverlay{{ fornecedor.id }}" aria-labelledby="modalValidadeLabel{{ fornecedor.id }}" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog--sm">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalValidadeLabel{{ fornecedor.id }}">Validade da Integração</h2>
                <button type="button" class="modal-close-button" data-modal-dismiss></button>
            </div>
            <div class="modal-body">
                <form id="formValidade{{ fornecedor.id }}">
                    <div class="form-group">
                        <label for="validadeMeses{{ fornecedor.id }}" class="form-label">Meses de validade</label>
                        <input type="number" class="form-input" id="validadeMeses{{ fornecedor.id }}"
                            name="validade_meses" value="12" min="1" max="36" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="modal-button modal-button--secondary" data-modal-dismiss>Cancelar</button>
                <button type="button" class="modal-button modal-button--primary btn-confirmar-link">Gerar Link</button>
            </div>
        </div>
    </div>
</div>

{# Modal para mostrar token e link #}
<div class="modal-overlay" id="modalLinkGeradoOverlay" aria-labelledby="modalLinkGeradoLabel" role="dialog" aria-modal="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalLinkGeradoLabel">Link de Integração Gerado</h2>
                <button type="button" class="modal-close-button" data-modal-dismiss></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Token:</label>
                    <input type="text" class="form-input" id="tokenGerado" readonly style="font-weight: bold;">
                </div>
                 <div class="form-group">
                    <label>Link:</label>
                    <a href="#" target="_blank" id="linkGerado" style="word-break: break-all;"></a>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="modal-button modal-button--secondary" data-modal-dismiss>Fechar</button>
            </div>
        </div>
    </div>
</div>
