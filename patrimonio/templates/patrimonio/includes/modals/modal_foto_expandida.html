{# patrimoio/templates/patrimonio/includes/modals/modal_foto_expandida.html #}
{# Este é um modal genérico para exibir fotos clicadas em tabelas #}

<div class="modal-overlay" id="modalFotoOverlay" aria-label="Foto Expandida" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog--lg" style="background: none;">
        <div class="modal-content" style="background: none; box-shadow: none;">
            <div class="modal-body" style="padding: 0; text-align: center;">
                <img src="" id="fotoExpandida" alt="Foto expandida" style="max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 8px;">
            </div>
            <div class="modal-footer" style="border: none; justify-content: center;">
                <button type="button" class="modal-button modal-button--secondary" data-modal-dismiss>Fechar</button>
            </div>
        </div>
    </div>
</div>
