{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integração Concluída</title>
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f9f9f9, #e0e7ff);
      color: #333;
      text-align: center;
      padding: 3rem 1rem;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      padding: 2rem;
      max-width: 500px;
      margin: auto;
    }

    h2 {
      color: #1d4ed8;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 2rem;
    }

    a.btn {
      background: #1d4ed8;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      transition: 0.3s ease;
      font-weight: 500;
    }

    a.btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Integração concluída com sucesso! ✅</h2>
  <p>Parabéns! Sua integração foi registrada no sistema.</p>

  <a href="{% url 'gerar_certificado_integracao' integracao.id %}" class="btn">
    🎓 Baixar Certificado
  </a>
</div>

</body>
</html>
