<!DOCTYPE html>
<html>
<head>
    <title>Autenticação de Integração</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-auth {
            max-width: 450px;
            margin: 80px auto;
            border-radius: 10px;
        }
        .btn-submit {
            width: 100%;
        }
        .alert-error {
            background-color: #f8d7da;
            border-color: #f5c2c7;
            color: #842029;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        label {
            font-weight: 500;
        }

        /* Responsividade para telas pequenas */
        @media (max-width: 576px) {
            .card-auth {
                margin: 30px 15px; /* menos espaço em cima e nas laterais */
                padding: 20px;
            }
            h4 {
                font-size: 1.25rem;
            }
            p.text-muted {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-4 shadow card-auth">
            <h4 class="mb-3 text-center">Autenticação da Integração</h4>
            <p class="text-center text-muted">Digite o token recebido para acessar o formulário.</p>

            {% if erro %}
                <div class="alert-error">{{ erro }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="uuid_link" value="{{ uuid_link }}">

                <div class="mb-3">
                    <label for="token" class="form-label">Token</label>
                    <input type="text" name="token" id="token" class="form-control" placeholder="Digite seu token" required>
                </div>

                <button type="submit" class="btn btn-primary btn-submit">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
