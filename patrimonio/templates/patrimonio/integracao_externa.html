<!DOCTYPE html>
<html>
<head>
    <title>Cadastro de Integração</title>
</head>
<body>
    <div class="container mt-5">
    <div class="card shadow p-4">
        <h4>Integração do Fornecedor</h4>
        <p><strong>Fornecedor:</strong> {{ fornecedor.nome_empresa }}</p>
        <p><strong>Status:</strong> {{ fornecedor.status }}</p>
        <hr>
        <form method="post">
        {% csrf_token %}
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="questao1" id="q1">
            <label for="q1" class="form-check-label">Questão 1: Todos os documentos foram enviados?</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="questao2" id="q2">
            <label for="q2" class="form-check-label">Questão 2: Os dados estão corretos?</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="questao3" id="q3">
            <label for="q3" class="form-check-label">Questão 3: Está de acordo com o contrato?</label>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Enviar Questionário</button>
        </form>
    </div>
    </div>
</body>
</html>
