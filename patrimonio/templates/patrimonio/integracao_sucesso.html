<!DOCTYPE html>
<html>
<head>
    <title>Integração Concluída</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-success {
            max-width: 450px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            background: #e7f1ff;
        }
        .card-success h3 {
            color: #0d6efd;
            margin-bottom: 20px;
        }
        .btn-home {
            margin-top: 20px;
            width: 100%;
        }
        @media (max-width: 576px) {
            .card-success {
                margin: 50px 15px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card card-success shadow">
            <h3>✅ Integração Concluída</h3>
            <p>O questionário foi enviado com sucesso e o processo de integração foi finalizado.</p>
        </div>
    </div>
</body>
</html>
